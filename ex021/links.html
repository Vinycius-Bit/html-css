<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Links</title>
    <style>
       /*
       
       SÍMBOLOS PRA USAR NAS CSS:
       # = ID
       . = CLASS
       : = PSEUDO-CLASS
       :: = PSEUDO-ELEMENTOS
       > = CHILDREN

       */
       
       body{
            font-family:Arial, Helvetica, sans-serif
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
            
        }
        a:visited{
            color: darkred
        }
        /* visited: quando o link tiver sido visitado
        */
        a:hover{
            color: black;
            text-decoration: underline;
            
        }
        /*hover: quando passar o mouse em cima
        */

        a:active{
        color: yellow;
        }
        /* active: quando eu clicar no link
        */

        a::after{
            content:'⇐' ;
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        /* :: <-- isso é uma pseudo classe.
        after: depois/do lado do link
        */
        
        .especial{
            background-color: antiquewhite;
        }
        
        .especial::after{
          content: '⇐';
         
        }
        .especial::before{
            content: '⇒';
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo" target="_blank" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
