<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas/Box-Level</title>
    <style>
        h1{ /*BOX LEVEL*/
            background-color: lightgray;
            height: 300px;
            width: 300px ;


            border-width: 10px;
            border-style: solid;
            border-color: darkslategrey;
            /*BORDER SIMPLIFICADO COM SHORTHAND:
            */
            border: 10px solid darkslategray;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*PADDING SIMPLIFICADO COM SHORTHAND*/
            padding: 10px;

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
            /*MARGIN SIMPLIFICADO
            */
            margin: 20px auto 40px auto ;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: rgb(255, 140, 1);
            /*OUTLINE SIMPLIFICADO
            */
            outline: 5px dashed rgb(255, 140, 1);
        }
        a{ /*INLINE LEVEL*/
            border-width: 10px;
            border-style: solid;
            border-color: brown;
        }
    </style>
</head>
<body>
    <h1>Exemplo de box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixa em inline-level</a>. Vamos ver como tudo isso funciona?</p>
</body>
</html>
